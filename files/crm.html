/* Reintento ante error de servidor/red (la base de datos puede tardar en despertar). */
function _wait(ms){ return new Promise(function(rs){ setTimeout(rs,ms); }); }
function _retry(fn,okFn){ var d=[1000,2500]; function att(i){ return fn().then(function(res){ if(okFn&&!okFn(res)&&i<d.length){ return _wait(d[i]).then(function(){return att(i+1);}); } return res; },function(err){ if(i<d.length){ return _wait(d[i]).then(function(){return att(i+1);}); } throw err; }); } return att(0); }

    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,data:j}; },function(){ return {ok:r.ok,status:r.status,data:{}}; }); });
}

/* GUARDADO POR REGISTRO: solo se envían al servidor los registros que han cambiado
   desde la última carga/guardado. Como /sync es "upsert" (nunca borra), esto evita que
   un usuario sobrescriba los cambios de otro: cada uno solo escribe lo que tocó. */
var SNAPSHOT=null;
var SYNC_COLS=['operaciones','leads','clientes','colaboradores','tareas','inversiones','socios','corretaje','deudas','promotores','proyectos','comunicaciones'];
function buildSnapshot(){
  SNAPSHOT={};
  SYNC_COLS.forEach(function(col){ var m={}; (DB&&DB[col]||[]).forEach(function(r){ if(r&&r.id!=null)m[r.id]=JSON.stringify(r); }); SNAPSHOT[col]=m; });
  SNAPSHOT._tes=JSON.stringify((DB&&DB.tesoreria)||{});
}
function computeSyncDelta(){
  if(!SNAPSHOT)buildSnapshot();
  var payload={}, next={};
  SYNC_COLS.forEach(function(col){ var arr=DB[col]||[], prev=SNAPSHOT[col]||{}, cur={}, changed=[];
    arr.forEach(function(r){ if(!r||r.id==null)return; var s=JSON.stringify(r); cur[r.id]=s; if(prev[r.id]!==s)changed.push(r); });
    if(changed.length)payload[col]=changed; next[col]=cur; });
  var tesStr=JSON.stringify(DB.tesoreria||{}); if(SNAPSHOT._tes!==tesStr)payload.tesoreria=DB.tesoreria;
  return {payload:payload, next:next, tes:tesStr, empty:(Object.keys(payload).length===0)};
}
function apiSync(){
  var d=computeSyncDelta();
  if(d.empty)return Promise.resolve({ok:true,empty:true});
  return _retry(function(){ return fetch(API_BASE+'/sync',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(d.payload)}).then(function(r){ return {ok:r.ok,status:r.status}; }); },function(res){ return res.ok; })
    .then(function(res){ if(res.ok){ SYNC_COLS.forEach(function(col){ SNAPSHOT[col]=d.next[col]; }); SNAPSHOT._tes=d.tes; } return res; });
}

/* costes de operación (con valores por defecto estimados si no se han fijado) */
var ITP_PCT=0.10; // ITP Comunidad Valenciana vivienda usada 10%
function opCostes(o){
  o.costes=o.costes||{};
  var c=o.costes;
  var itp=(c.itp!=null)?c.itp:Math.round((o.compra||0)*ITP_PCT);
  var notaria=(c.notaria!=null)?c.notaria:(o.compra?1200:0);
  var registro=(c.registro!=null)?c.registro:(o.compra?600:0);
  var plusvalia=(c.plusvalia!=null)?c.plusvalia:0;
  var mantenimiento=(c.mantenimiento!=null)?c.mantenimiento:0;
  var comisionVenta=(c.comisionVenta!=null)?c.comisionVenta:0;
  var comisionColab=(c.comisionColab!=null)?c.comisionColab:0;
  var otros=(c.otros!=null)?c.otros:0;
  return {itp:itp,notaria:notaria,registro:registro,plusvalia:plusvalia,mantenimiento:mantenimiento,comisionVenta:comisionVenta,comisionColab:comisionColab,otros:otros};
}
function opCostesTotal(o){ var c=opCostes(o); return c.itp+c.notaria+c.registro+c.plusvalia+c.mantenimiento+c.comisionVenta+c.comisionColab+c.otros; }
function opCur(o){ return (o&&o.moneda)||'EUR'; }
function opIsOffplan(o){ return o&&o.detalle&&typeof o.detalle==='object'&&Object.keys(o.detalle).length>0; }
function abbrNum(n){ n=Math.round(Number(n)||0); var s=n<0?'-':''; n=Math.abs(n); if(n>=1e6)return s+(n/1e6).toFixed(2).replace(/\.?0+$/,'').replace('.',',')+'M'; if(n>=1e3)return s+Math.round(n/1e3)+'K'; return s+n; }
/* ===== Sistema central de divisa (AED ⇄ EUR) con tipo de cambio en vivo =====
   FX_AED = cuántos AED vale 1 unidad de cada divisa (fallback; en vivo desde /api/fx).
   DISPLAY_CUR = divisa en la que se MUESTRA todo (toggle). Todo importe se convierte
   primero a AED (su base real) y luego a la divisa de visualización. */
var FX_AED={AED:1,EUR:4.0,USD:3.6725,SAR:1.02,GBP:4.68};
var DISPLAY_CUR='AED';
try{ var _dc0=localStorage.getItem('brava_cur'); if(_dc0==='EUR'||_dc0==='AED')DISPLAY_CUR=_dc0; }catch(e){}
function fxAedPer(cur){ return (window.FXLIVE&&window.FXLIVE[cur])||FX_AED[cur]||1; }
function toAED(n,cur){ return (Number(n)||0)*fxAedPer(cur||'AED'); }
function invAED(n,cur){ return toAED(n,cur); }
function toDisp(n,cur){ var aed=toAED(n,cur); return DISPLAY_CUR==='AED'?aed:aed/fxAedPer(DISPLAY_CUR); }
function fmtCur(v){ v=Math.round(Number(v)||0); return DISPLAY_CUR==='EUR'?euro(v):(v.toLocaleString('es-ES')+' '+DISPLAY_CUR); }
function fmtCurK(v){ return DISPLAY_CUR==='EUR'?euroK(v):(abbrNum(v)+' '+DISPLAY_CUR); }
function money(n,cur){ return fmtCur(toDisp(n,cur)); }
function moneyK(n,cur){ return fmtCurK(toDisp(n,cur)); }
function invMoney(n,cur){ return money(n,cur); }
function invMoneyK(n,cur){ return moneyK(n,cur); }
function opMoney(n,o){ return money(n,opCur(o)); }
function opMoneyK(n,o){ return moneyK(n,opCur(o)); }

function opInvertido(o){ return (o.compra||0)+(o.reforma||0); }                 /* desembolso directo */
function opCosteTotal(o){ return opInvertido(o)+opCostesTotal(o); }              /* todo lo que cuesta */
function opMargenBruto(o){ var salida=o.ventaReal||o.ventaPrev||0; return salida-opInvertido(o); }
function opMargen(o){ var salida=o.ventaReal||o.ventaPrev||0; return salida-opCosteTotal(o); } /* margen NETO real */
function opMargenPct(o){ var base=opCosteTotal(o); return base?Math.round(opMargen(o)/base*100):0; }
/* coinversión: reparto del margen neto */
function opReparto(o){
  var mg=opMargen(o);
  if(o.financiacion!=='Coinversión'||!o.coinversion||!o.coinversion.length) return [{quien:'Brava Dubai',pct:100,importe:mg,aporte:opCosteTotal(o)}];
  var aporteTotal=o.coinversion.reduce(function(s,p){return s+(p.aporte||0);},0)||1;
  var rep=o.coinversion.map(function(p){ return {quien:p.quien,pct:Math.round((p.aporte||0)/aporteTotal*100),importe:Math.round(mg*(p.aporte||0)/aporteTotal),aporte:p.aporte||0}; });
  /* Ajuste de redondeo: el último socio absorbe el resto para que los % sumen 100 y los importes sumen el margen */
  if(rep.length){ var sp=0,si=0,i; for(i=0;i<rep.length-1;i++){ sp+=rep[i].pct; si+=rep[i].importe; } var last=rep[rep.length-1]; last.pct=100-sp; last.importe=mg-si; }
  return rep;
}
/* Capital propio de Brava en una operación (para tesorería): identifica el socio Brava de forma flexible;
   si no hay socio con "Brava" en el nombre, Brava pone el remanente no cubierto por los socios externos. */
function opAporteBrava(o){
  var rep=opReparto(o);
  var vlc=rep.find(function(x){return /vlc/i.test(x.quien||'');});
  if(vlc)return vlc.aporte;
  var suma=rep.reduce(function(s,x){return s+(x.aporte||0);},0);
  return Math.max(0,opCosteTotal(o)-suma);
}
function isCerrada(o){ return o.estado==='Vendida'; }
function isActiva(o){ return ['Comprada','Reforma','En venta'].indexOf(o.estado)>-1; }

function metrics(){
  var ops=DB.operaciones;
  var activas=ops.filter(isActiva);
  var cerradas=ops.filter(isCerrada);
  var pipeline=ops.filter(function(o){ return ['Oportunidad','Debido diligencia','Oferta enviada','Aceptada','En notaría'].indexOf(o.estado)>-1; });
  /* Capital desplegado = dinero realmente PAGADO en operaciones vivas (compradas/en curso o
     reservadas en notaría). Una sola pasada (sin duplicar las "Comprada") y normalizado a AED. */
  var capitalDesplegado=ops.filter(function(o){ return isActiva(o)||o.estado==='En notaría'; })
      .reduce(function(s,o){ return s+invAED(o.pagado||0,opCur(o)); },0);
  var margenRealizado=cerradas.reduce(function(s,o){ return s+opMargen(o); },0);
  var margenPotencial=activas.concat(pipeline).reduce(function(s,o){ return s+opMargen(o); },0);
  var leadsNuevos=DB.leads.filter(function(l){ return l.estadoLead==='Nuevo'; }).length;
  var hoy=today();
  var tareasPendientes=(DB.tareas||[]).filter(function(t){ return t.estado!=='Hecha' && t.fecha && t.fecha<=hoy; }).length;
  /* TESORERÍA: caja = fondos - capital comprometido en operaciones vivas */
  var fondos=(DB.tesoreria&&DB.tesoreria.fondos)||0;
  var comprometido=ops.filter(function(o){ return ['En notaría','Comprada','Reforma','En venta'].indexOf(o.estado)>-1; })
      .reduce(function(s,o){ return s+opCosteTotal(o); },0);
  var soloBrava=ops.filter(function(o){ return ['En notaría','Comprada','Reforma','En venta'].indexOf(o.estado)>-1; })
      .reduce(function(s,o){ return s+opAporteBrava(o); },0);
  var libre=fondos-soloBrava;
  return {
    total:ops.length, activas:activas.length, cerradas:cerradas.length, pipeline:pipeline.length,
    capitalDesplegado:capitalDesplegado, margenRealizado:margenRealizado, margenPotencial:margenPotencial,
    leadsNuevos:leadsNuevos, leads:DB.leads.length, clientes:DB.clientes.length, colaboradores:DB.colaboradores.length,
    tareasPendientes:tareasPendientes,
    comisionesPend:DB.colaboradores.reduce(function(s,c){ return s+(c.comision||0); },0),
    fondos:fondos, comprometido:comprometido, comprometidoBrava:soloBrava, libre:libre
  };
}

/* ---------- exportación CSV ---------- */
function toCSV(rows){ return rows.map(function(r){ return r.map(function(c){ var s=(c==null?'':String(c)); if(/[";\n\r]/.test(s))s='"'+s.replace(/"/g,'""')+'"'; return s; }).join(';'); }).join('\r\n'); }
function downloadCSV(name,head,data){
  try{
    var csv='﻿'+toCSV([head].concat(data));
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },800);
    toast('CSV exportado');
  }catch(e){ toast('No se pudo exportar'); }
}

/* ---------- informes imprimibles (guardar como PDF) ---------- */
function iaOpen(path, body, msg){
  toast(msg||'Generando con IA…');
  fetch(API_BASE+'/'+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,data:j}; }); })
    .then(function(res){ if(res.ok&&res.data&&res.data.html){ var w=window.open('','_blank'); if(w){ w.document.open(); w.document.write(res.data.html); w.document.close(); toast('Listo · usa Imprimir → Guardar como PDF'); } else { toast('Permite las ventanas emergentes para ver el documento'); } } else { toast((res.data&&res.data.error)||'No se pudo generar'); } })
    .catch(function(){ toast('Error de conexión con la IA'); });
}
function iaEmail(path, body, defaultEmail){
  var to=prompt('Enviar por email a:', defaultEmail||''); if(!to)return; to=to.trim(); if(!/@/.test(to)){ toast('Email no válido'); return; }
  toast('Enviando por email…');
  fetch(API_BASE+'/'+path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(Object.assign({enviarA:to},body))})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,data:j}; }); })
    .then(function(res){ var d=res.data||{}; if(res.ok&&d.sent){ toast('✓ Enviado a '+to); } else if(res.ok&&d.emailConfig===false){ toast('No hay ningún canal de correo corporativo disponible. Revisa Microsoft 365 en Correo electrónico.'); } else { toast((d&&d.error)||'No se pudo enviar'); } })
    .catch(function(){ toast('Error de conexión'); });
}
function printReport(html){

}
function repHead(title,sub){ return '<div class="rep-head"><div><img src="'+Brava_LOGO+'" alt="Brava Dubai" style="height:32px;width:auto;display:block;margin-bottom:5px"><div class="rep-sub">'+(sub||'')+'</div></div><div class="rep-date">Generado: '+fdate(today())+'</div></div><div class="rep-title">'+title+'</div>'; }

function reportOp(o){
  var c=opCostes(o), mg=opMargen(o), salida=o.ventaReal||o.ventaPrev||0, costeTot=opCosteTotal(o);

    +'<h3>Economía de la operación</h3>'+repRow('Precio de compra',euro(o.compra))+repRow('Reforma',euro(o.reforma))+repRow('ITP / impuestos',euro(c.itp))+repRow('Notaría y registro',euro(c.notaria+c.registro))+(c.plusvalia?repRow('Plusvalía municipal',euro(c.plusvalia)):'')+(c.comisionVenta?repRow('Comisión de venta',euro(c.comisionVenta)):'')+(c.comisionColab?repRow('Comisión colaborador',euro(c.comisionColab)):'')+(c.mantenimiento?repRow('Mantenimiento',euro(c.mantenimiento)):'')+(c.otros?repRow('Otros',euro(c.otros)):'')
    +repRow('Coste total real',euro(costeTot),'tot')+repRow(o.ventaReal?'Venta real':'Venta prevista',euro(salida))+repRow('Margen NETO',euro(mg)+' · '+opMargenPct(o)+'%',(mg>=0?'pos tot':'neg tot'))
    +((o.pagos&&o.pagos.length)?('<h3>Pagos y flujo de caja</h3><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="r">Importe</th></tr></thead><tbody>'+o.pagos.map(function(p){ return '<tr><td>'+fdate(p.f)+'</td><td>'+p.c+'</td><td class="r">'+(p.i<0?'+ ':'')+euro(Math.abs(p.i))+'</td></tr>'; }).join('')+'</tbody></table>'):'')

function reportCartera(){
  var m=metrics();

  var invTot=0,ventaTot=0,mgTot=0;

    return '<tr><td>'+o.ref+'</td><td>'+o.direccion.split(',')[0]+'</td><td>'+o.estado+'</td><td class="r">'+opMoneyK(inv,o)+'</td><td class="r">'+opMoneyK(venta,o)+'</td><td class="r '+(mg>=0?'pos':'neg')+'">'+opMoneyK(mg,o)+'</td><td class="r">'+opMargenPct(o)+'%</td></tr>'; }).join('');
  var html=repHead('Informe de cartera','Resumen de operaciones · '+ops.length+' registros')
    +'<h3>Resumen</h3>'+repRow('Capital desplegado (pagado en operaciones)',money(m.capitalDesplegado,'AED'))+repRow('Margen realizado (cerradas)',money(m.margenRealizado,'AED'),'pos')+repRow('Margen potencial (en curso)',money(m.margenPotencial,'AED'))+repRow('Caja libre',money(m.libre,'AED'))

}

function fsize(n){ n=n||0; if(n>=1048576)return (n/1048576).toFixed(1)+' MB'; if(n>=1024)return Math.round(n/1024)+' KB'; return n+' B'; }
function fileToDataURL(file,cb){ var r=new FileReader(); r.onload=function(){ cb(r.result); }; r.onerror=function(){ cb(null); }; r.readAsDataURL(file); }
/* sube una lista de archivos, en secuencia, a una operación */
function uploadFilesSeq(opId,cat,files,done){
  var arr=Array.prototype.slice.call(files||[]), i=0, ok=0;
  (function next(){
    if(i>=arr.length){ done&&done(ok); return; }
    var f=arr[i++];
    if(f.size>5*1024*1024){ toast('«'+f.name+'» supera 5 MB, omitido'); next(); return; }
    fileToDataURL(f,function(durl){
      if(!durl){ next(); return; }
      apiDocUpload({opId:opId,nombre:f.name,categoria:cat,tipo:f.type,data:durl}).then(function(r){ if(r.ok)ok++; next(); }).catch(function(){ next(); });
    });
  })();
}

function rgKpi(l,v,sub,col){ return '<div style="background:var(--panel,#fff);border:1px solid var(--line2);border-radius:14px;padding:13px 14px"><div style="font-size:11.5px;color:var(--grey);font-weight:600">'+l+'</div><div style="font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:5px'+(col?';color:'+col:'')+'">'+v+'</div>'+(sub?'<div style="font-size:11px;color:var(--grey2);margin-top:2px">'+sub+'</div>':'')+'</div>'; }
function loadRgKpis(){
  apiG('/rg/analitica').then(function(r){
    var box=$('#rgKpis'); if(!box)return; if(!r.ok){ box.style.display='none'; return; }
    var a=r.data, rt=a.rentabilidad||{}, m=a.mes||{};
    box.innerHTML=[
      rgKpi('Expedientes',a.total||0,(a.activos||0)+' activos'),
      rgKpi('Renta comprometida',euro0(a.rentaComprometida||0),'al mes (activos)'),
      rgKpi('Ocupación',(a.ocupacion||0)+'%','de los activos'),
      rgKpi('Margen acumulado',euro0(rt.margen||0),(rt.pct||0)+'% s/ cobros',((rt.margen||0)>=0?'var(--pos)':'var(--neg)')),
      rgKpi('Este mes',euro0(m.margen||0),'margen '+(m.periodo||'')),
      rgKpi('Incidencias',a.incidenciasAbiertas||0,'en curso',(a.incidenciasAbiertas?'var(--warn)':''))
    ].join('');
  });
}

function rgCobroChip(m,tipo){
  if(!m)return chip(tipo==='pago'?'Sin pago':'Sin cargo','c-grey');
  var lbl=m.estado==='confirmado'?(tipo==='pago'?'Pagado':'Cobrado'):(m.estado==='parcial'?'Parcial':'Pendiente');
  var cls={'confirmado':'c-pos','parcial':'c-warn','pendiente':'c-grey'}[m.estado]||'c-grey';
  return chip(lbl+' · '+euro0(m.importe),cls);
}
function loadRgCartera(periodo){
  apiG('/rg/cartera?periodo='+encodeURIComponent(periodo)).then(function(r){
    var box=$('#rgcBox'), kp=$('#rgcKpis'); if(!box)return;
    if(!r.ok){ box.innerHTML='<div class="role-note">'+esc((r.data&&r.data.error)||'No se pudo cargar')+'</div>'; if(kp)kp.style.display='none'; return; }
    var t=r.data.totales||{}, rows=r.data.rows||[];
    var ocup=t.activos?Math.round((t.activos-(t.vacantes||0))/t.activos*100):0;
    if(kp){ kp.style.display=''; kp.innerHTML=[
      rgKpi('Comprometido/mes',euro0(t.comprometido||0),'renta a propietarios'),
      rgKpi('Cobrado inquilinos',euro0(t.cobrado||0),(t.cobradoPend?'pendiente '+euro0(t.cobradoPend):'todo cobrado'),((t.cobradoPend||0)?'var(--warn)':'var(--pos)')),
      rgKpi('Pagado propietarios',euro0(t.pagado||0),(t.pagadoPend?'pendiente '+euro0(t.pagadoPend):'todo pagado'),((t.pagadoPend||0)?'var(--warn)':'var(--pos)')),
      rgKpi('Diferencia (Brava)',euro0(t.diferencia||0),'cobrado − pagado',((t.diferencia||0)>=0?'var(--pos)':'var(--neg)')),
      rgKpi('Ocupación',ocup+'%',(t.vacantes?t.vacantes+' vacante(s)':'todo ocupado'),((t.vacantes||0)?'var(--warn)':'')),
      rgKpi('Contratos por vencer',String(t.venceProx||0),'≤ 60 días',((t.venceProx||0)?'var(--warn)':''))
    ].join(''); }
    if(!rows.length){ box.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21h18M6 21V9l6-4 6 4v12"/></svg><h3>Sin expedientes activos</h3><p>Cuando haya expedientes en explotación aparecerán aquí, con su cobro y su pago de cada mes.</p></div>'; return; }
    box.innerHTML='<div class="card"><div class="card-body"><table><thead><tr><th>Expediente</th><th class="hide-sm">Municipio</th><th>Renta prop.</th><th>Cobro inquilino</th><th>Pago propietario</th><th class="hide-sm">Ocupación</th><th class="hide-sm">Vence</th></tr></thead><tbody>'+rows.map(function(x){
      return '<tr data-rgc="'+x.id+'" style="cursor:pointer"><td><div class="tname">'+esc(x.ref||'')+'</div><div class="tsub">'+esc(x.contacto||'')+(x.inquilino?' · '+esc(x.inquilino):'')+'</div></td>'
        +'<td class="hide-sm">'+esc(x.municipio||'')+'</td>'
        +'<td class="num">'+euro0(x.rentaPropuesta)+'</td>'
        +'<td>'+rgCobroChip(x.cobro,'cobro')+'</td>'
        +'<td>'+rgCobroChip(x.pago,'pago')+'</td>'
        +'<td class="hide-sm">'+(x.ocupado?chip('Ocupado','c-pos'):chip('Vacante','c-neg'))+'</td>'
        +'<td class="hide-sm">'+(x.finContrato?fdate(x.finContrato):'—')+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';
    $$('[data-rgc]').forEach(function(el){ el.onclick=function(){ if(typeof openRgExp==='function')openRgExp(el.getAttribute('data-rgc')); }; });
  }).catch(function(){ var box=$('#rgcBox'); if(box)box.innerHTML='<div class="role-note">Sin conexión con el servidor</div>'; });
}

var RG_FIRMABLE=['Propuesta aceptada','Contrato pendiente','Contrato firmado'];
function rgFirmaPanel(e){
  if(!BACKEND) return '';
  var f=e.firma||{};
  if(RG_FIRMABLE.indexOf(e.estado)<0 && !f.estado) return '';
  var h='<div class="section-title">Firma del contrato</div>';
  if(f.estado==='firmada'){
    h+='<div style="margin-bottom:6px">'+chip('Firmado electrónicamente','c-pos')+'</div>'
      +'<div class="drow"><span class="dk">Firmante</span><span class="dv">'+esc(f.firmante||'—')+'</span></div>'
      +'<div class="drow"><span class="dk">Fecha · método</span><span class="dv">'+(f.firmadoAt?fdate((f.firmadoAt||'').slice(0,10)):'—')+' · firma electrónica simple'+(f.ip?' · IP '+esc(f.ip):'')+'</span></div>';
  } else if(f.estado==='solicitada'){
    h+='<div class="role-note" style="margin:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 2"/></svg>Firma solicitada al propietario'+(f.solicitadaAt?' el '+fdate((f.solicitadaAt||'').slice(0,10)):'')+'. Pendiente de que firme desde su portal.</div>'
      +'<div style="margin-top:8px"><button class="btn ghost" id="rgReenvFirma" style="padding:7px 11px;font-size:12.5px">Reenviar aviso</button></div>';
  } else {
    h+='<div style="color:var(--grey);font-size:13px;margin-bottom:8px">Aún no se ha solicitado la firma. Requiere aprobación del comité y propietario registrado en el portal.</div>'
      +'<button class="btn" id="rgSolFirma" style="padding:8px 13px;font-size:13px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Solicitar firma al propietario</button>';

/* ---- Renta garantizada: scoring, valoración y propuesta ---- */
var RG_SCORE_CATS=[['ubicacion','Ubicación y demanda'],['propiedad','Propiedad y estado'],['rentabilidad','Rentabilidad prevista'],['juridico','Situación jurídica'],['operativo','Riesgo operativo']];
var RG_SCORE_W={ubicacion:.25,propiedad:.20,rentabilidad:.30,juridico:.15,operativo:.10};
function rgScoreTotal(s){ s=s||{}; var t=0; RG_SCORE_CATS.forEach(function(c){ t+=(parseInt(s[c[0]],10)||0)*RG_SCORE_W[c[0]]; }); return Math.round(t); }
function rgNivel(t){ return t>=70?'Bajo':(t>=50?'Medio':'Alto'); }
function rgModsRecomendadas(e){
  var d=e.datos||{}, mods=[];
  if(d.aceptaRentaInferior) mods.push('Gestión con garantía de cobro');
  if(d.autVacacional) mods.push('Gestión vacacional');
  if(d.autTemporal) mods.push('Alquiler temporal / corporativo');
  if(d.quiereOfertaCompra) mods.push('Propuesta de compra');
  if(!mods.length) mods.push('Gestión tradicional');
  return mods;
}
function rgRentaMax(e){ var s=e.scoring||{}, tot=s.total!=null?s.total:rgScoreTotal(s); var descMin=12,descMax=20; var desc=descMax-(descMax-descMin)*(tot/100); return e.rentaMercado?Math.round(e.rentaMercado*(1-desc/100)/10)*10:0; }
function rgAnalisisResumen(e){
  var s=e.scoring||{}, v=e.valoracion||{}; if(!(s.total!=null)&&!(v.margenMensual!=null))return '';
  var h='<div class="section-title">Análisis</div>';
  if(s.total!=null){ var col=s.total>=70?'var(--pos)':(s.total>=50?'var(--warn)':'var(--neg)'); h+='<div class="drow"><span class="dk">Puntuación · nivel de riesgo</span><span class="dv"><b style="color:'+col+'">'+s.total+'/100 · '+(s.nivel||rgNivel(s.total))+'</b></span></div>'; if(s.rentaMax)h+='<div class="drow"><span class="dk">Renta máxima ofrecible</span><span class="dv">'+euro(s.rentaMax)+'</span></div>'; }
  if(v.margenMensual!=null){ h+='<div class="drow"><span class="dk">Margen estimado</span><span class="dv" style="color:'+(v.margenMensual>=0?'var(--pos)':'var(--neg)')+'">'+euro(v.margenMensual)+'/mes · '+(v.margenPct||0)+'%</span></div>'; }
  return h;
}
function rgScoreAuto(e){
  var d=e.datos||{}, clamp=function(x){return Math.max(0,Math.min(100,Math.round(x/5)*5));};
  var ub=58; if(e.municipio)ub+=8; if(d.zona)ub+=6; if(/valencia|torrent|paterna|mislata|burjassot|alacant|alicante|gandia|sagunt/i.test(e.municipio||''))ub+=12;
  var estados={'A estrenar':90,'Buen estado':76,'Para actualizar':56,'A reformar':42};
  var pr=estados[d.estadoConservacion]||62; if(d.ascensor)pr+=5; if(d.terraza)pr+=4; var sup=parseInt(d.superficie,10)||0; if(sup>=60&&sup<=140)pr+=5; else if(sup>0&&sup<40)pr-=8;
  var re=60, rm=parseInt(e.rentaMercado,10)||0, rs=parseInt(e.rentaSolicitada,10)||0; if(rm>0&&rs>0)re=60+((rm-rs)/rm)*140; if(d.aceptaRentaInferior)re+=10;
  var vj={'ok':90,'en revisión':66,'pendiente':56,'bloqueada':18}, ju=(vj[e.validacionJuridica]!=null?vj[e.validacionJuridica]:56); if(d.ocupada==='Ocupación no autorizada')ju-=35; else if(d.ocupada==='Con inquilino')ju-=6;
  var op=62; if(/inmediat/i.test(d.disponibilidad||''))op+=10; if(d.autVacacional)op+=6; if(d.autTemporal)op+=6; if(d.ocupada==='Libre')op+=6; if(d.ocupada==='Ocupación no autorizada')op-=25;
  return {ubicacion:clamp(ub),propiedad:clamp(pr),rentabilidad:clamp(re),juridico:clamp(ju),operativo:clamp(op)};
}
function openRgScoring(e){
  var s=e.scoring||{};
  var body='<div class="role-note" style="margin-bottom:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Puntúa cada factor de 0 a 100 (mayor = mejor / menor riesgo). Pulsa <b>Sugerir</b> para un pre-relleno automático a partir de los datos del expediente; luego ajústalo.</div>'
    +'<button class="btn ghost" id="scAuto" style="margin-bottom:14px;padding:8px 13px;font-size:13px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg>Sugerir automáticamente</button>'
    +RG_SCORE_CATS.map(function(c){ var val=parseInt(s[c[0]],10); if(isNaN(val))val=60; return '<div class="ff" style="margin-bottom:12px"><label style="display:flex;justify-content:space-between"><span>'+c[1]+' <span style="color:var(--grey2)">('+Math.round(RG_SCORE_W[c[0]]*100)+'%)</span></span><b data-out="'+c[0]+'">'+val+'</b></label><input type="range" min="0" max="100" step="5" data-sc="'+c[0]+'" value="'+val+'" style="width:100%"></div>'; }).join('')
    +'<div class="marginbox" id="scOut"></div>';
  openModal('Scoring del activo',e.ref,body,[{t:'Cancelar',cls:'ghost',fn:function(){ openRgExp(e.id); }},{t:'Guardar scoring',cls:'',fn:function(){
    var sc={}; $$('#modalCard [data-sc]').forEach(function(el){ sc[el.getAttribute('data-sc')]=parseInt(el.value,10)||0; });
    sc.total=rgScoreTotal(sc); sc.nivel=rgNivel(sc.total); sc.rentaMax=rgRentaMax({scoring:sc,rentaMercado:e.rentaMercado}); sc.modalidades=rgModsRecomendadas(e);
    apiPP('/rg/expedientes/'+e.id,'PUT',{scoring:sc}).then(function(r){ if(r.ok){ toast('Scoring guardado'); openRgExp(e.id); loadRgRows(); } else toast('No se pudo'); });
  }}]);
  function upd(){ var sc={}; $$('#modalCard [data-sc]').forEach(function(el){ sc[el.getAttribute('data-sc')]=parseInt(el.value,10)||0; var o=$('[data-out="'+el.getAttribute('data-sc')+'"]'); if(o)o.textContent=el.value; }); var t=rgScoreTotal(sc),n=rgNivel(t),rm=rgRentaMax({scoring:sc,rentaMercado:e.rentaMercado}); var col=t>=70?'var(--pos)':(t>=50?'var(--warn)':'var(--neg)'); $('#scOut').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:12px;color:var(--grey);text-transform:uppercase;letter-spacing:.05em">Puntuación total</div><div style="font-size:26px;font-weight:800;color:'+col+'">'+t+'/100 · riesgo '+n+'</div></div><div style="text-align:right"><div style="font-size:12px;color:var(--grey)">Renta máx. ofrecible</div><div style="font-size:20px;font-weight:800">'+(rm?euro(rm):'—')+'</div></div></div><div style="margin-top:10px;font-size:13px;color:var(--grey)">Modalidades sugeridas: '+rgModsRecomendadas(e).join(' · ')+'</div>'; }
  $$('#modalCard [data-sc]').forEach(function(el){ el.oninput=upd; }); upd();
  var sa=$('#scAuto'); if(sa)sa.onclick=function(){ var au=rgScoreAuto(e); $$('#modalCard [data-sc]').forEach(function(el){ var k=el.getAttribute('data-sc'); if(au[k]!=null)el.value=au[k]; }); upd(); toast('Scoring sugerido a partir de los datos'); };
}
function openRgValoracion(e){
  var v=e.valoracion||{};
  function g(k,d){ return v[k]!=null?v[k]:d; }
  var rows=[['ingreso','Ingreso mensual que genera el activo (€)',g('ingreso',e.rentaMercado||0)],['rentaProp','Renta a pagar al propietario (€)',g('rentaProp',e.rentaPropuesta||0)],['comunidad','Comunidad (€/mes)',g('comunidad',0)],['ibi','IBI (€/año)',g('ibi',0)],['seguros','Seguros (€/mes)',g('seguros',0)],['mantenimiento','Mantenimiento (€/mes)',g('mantenimiento',30)],['comercializacion','Comercialización (€/mes)',g('comercializacion',0)],['suministros','Suministros a cargo (€/mes)',g('suministros',0)],['vacancia','Vacancia estimada (%)',g('vacancia',5)],['fondo','Fondo de contingencia (€/mes)',g('fondo',0)]];
  var body='<div class="fgrid">'+rows.map(function(r){ return '<div class="ff"><label>'+r[1]+'</label><input type="number" data-v="'+r[0]+'" value="'+r[2]+'"></div>'; }).join('')+'</div><div class="marginbox" id="vOut" style="margin-top:14px"></div>';
  openModal('Valoración financiera',e.ref,body,[{t:'Cancelar',cls:'ghost',fn:function(){ openRgExp(e.id); }},{t:'Guardar valoración',cls:'',fn:function(){
    var val=calc(); apiPP('/rg/expedientes/'+e.id,'PUT',{valoracion:val}).then(function(r){ if(r.ok){ toast('Valoración guardada'); openRgExp(e.id); loadRgRows(); } else toast('No se pudo'); });
  }}]);
  function read(){ var o={}; $$('#modalCard [data-v]').forEach(function(el){ o[el.getAttribute('data-v')]=parseFloat(el.value)||0; }); return o; }
  function calc(){ var o=read(); var ing=o.ingreso, vac=ing*(o.vacancia/100); var costes=o.rentaProp+o.comunidad+(o.ibi/12)+o.seguros+o.mantenimiento+o.comercializacion+o.suministros+o.fondo+vac; var margen=Math.round(ing-costes); var pct=ing?Math.round(margen/ing*100):0; var rentaMax=Math.round((ing-(costes-o.rentaProp)));
    return Object.assign(o,{costesMensuales:Math.round(costes),margenMensual:margen,margenAnual:margen*12,margenPct:pct,rentaMaxPagable:rentaMax,ocupacionMin:ing?Math.min(100,Math.round(costes/ing*100)):0}); }
  function upd(){ var c=calc(); var col=c.margenMensual>=0?'var(--pos)':'var(--neg)'; $('#vOut').innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 20px"><div><div style="font-size:12px;color:var(--grey)">Margen mensual</div><div style="font-size:22px;font-weight:800;color:'+col+'">'+euro(c.margenMensual)+'</div></div><div><div style="font-size:12px;color:var(--grey)">Margen anual · %</div><div style="font-size:18px;font-weight:700;color:'+col+'">'+euro(c.margenAnual)+' · '+c.margenPct+'%</div></div><div><div style="font-size:12px;color:var(--grey)">Renta máx. pagable al propietario</div><div style="font-size:17px;font-weight:700">'+euro(c.rentaMaxPagable)+'</div></div><div><div style="font-size:12px;color:var(--grey)">Ocupación mínima</div><div style="font-size:17px;font-weight:700">'+c.ocupacionMin+'%</div></div></div>'; }
  $$('#modalCard [data-v]').forEach(function(el){ el.oninput=upd; }); upd();
}

function topbar(title,sub,actions){

function kpi(label,val,desc,ic,dir,dtxt){
  return '<div class="kpi"><div class="kl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">'+(ICONS[ic]||'')+'</svg>'+label+'</div><div class="kv">'+val+'</div><div class="kd '+dir+'">'+(dtxt||desc)+'</div></div>';
}
function fields(arr){
  return '<div class="frow" style="display:block">'+arr.map(function(f){
    var key=f[0],lab=f[1],val=f[2],type=f[3]||'text',cls=f[4]||'';
    var inp;
    if((type||'').indexOf('select:')===0){
      var opts=type.slice(7).split(',').map(function(o){ return '<option'+(String(val)===o?' selected':'')+'>'+o+'</option>'; }).join('');
      inp='<select data-k="'+key+'">'+opts+'</select>';
    } else {
      inp='<input data-k="'+key+'" type="'+(type==='number'?'number':'text')+'" value="'+(val!==undefined&&val!==null?String(val).replace(/"/g,'&quot;'):'')+'">';
    }
    return '<div class="ff '+(cls==='full'?'full':'')+'" style="margin-bottom:14px">'+'<label>'+lab+'</label>'+inp+'</div>';
  }).join('')+'</div>';
}

function openModal(title,sub,body,actions){
  var foot=(actions||[]).map(function(a,i){ return '<button class="btn '+(a.cls||'')+'" data-act="'+i+'"'+(a.disabled?' disabled style="opacity:.5;cursor:not-allowed"':'')+'>'+a.t+'</button>'; }).join('');
  modalCard.innerHTML='<div class="modal-head"><div><h3>'+title+'</h3><div class="msub">'+(sub||'')+'</div></div><button class="modal-close" id="mClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'
    +'<div class="modal-body">'+body+(foot?'<div class="modal-foot">'+foot+'</div>':'')+'</div>';
  modal.classList.add('show');
  $('#mClose').onclick=closeModal;
  (actions||[]).forEach(function(a,i){ var b=$('[data-act="'+i+'"]',modalCard); if(b)b.onclick=a.fn; });
}
function closeModal(){ modal.classList.remove('show'); }
modal.onclick=function(e){ if(e.target===modal)closeModal(); };

/* confirmación de borrado */
function confirmDelete(titulo,detalle,onConfirm){
  openModal('¿Eliminar '+titulo+'?', detalle||'Esta acción no se puede deshacer.',
    '<div style="background:var(--neg-bg);color:var(--neg);border-radius:12px;padding:16px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:flex-start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px;flex:none;margin-top:1px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><span>Vas a eliminar <b>'+titulo+'</b> de forma permanente. No podrás recuperarlo.</span></div>',
    [{t:'Cancelar',cls:'ghost',fn:closeModal},{t:'Sí, eliminar',cls:'danger',fn:onConfirm}]);
}
/* eliminar entidad (backend o local) */
function deleteEntity(entidad,id,cb){
  function quitarLocal(){ var arr=DB[entidad]; if(arr){ var i=arr.findIndex(function(x){return x.id===id;}); if(i>-1)arr.splice(i,1); } }
  if(BACKEND){
    apiDelete(entidad,id).then(function(r){ if(r.ok){ quitarLocal(); cb(); } else { toast(r.data.error||'No se pudo eliminar'); } }).catch(function(){ toast('Sin conexión con el servidor'); });
  } else {
    quitarLocal(); save(); cb();
  }
}

/* toast */
var toastEl=$('#toast'),toastMsg=$('#toastMsg'),toastT;
function toast(msg){ if(toast._last===msg && (+new Date()-(toast._at||0))<4500)return; toast._last=msg; toast._at=+new Date(); toastMsg.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove('show'); },2600); }

var NAV_LOGO={ propiedades:{logo:'/brand/brava-realestate-color.png',t:'Brava Real Estate'}, rentagarantizada:{logo:'/garentto-symbol.png',t:'Brava Rent'} };
/* logos de marca para las cabeceras de sección del menú */
var SEC_LOGO={ 'Brava Dubai':'/brand/brava-investment-color.png', 'Brava Real Estate':'/brand/brava-realestate-color.png', 'Brava Rent':'/brand/brava-rent-color.png' };
/* Visibilidad por división: superadmin/admin lo ven todo (la "madre").
   Un usuario de equipo con divisiones asignadas ve solo las suyas + lo común.
   Si no tiene divisiones marcadas, ve todo (compatibilidad). */
function navVisible(it){
  if(!it.div) return true;
  if(isSuperRole(SESSION.role)||SESSION.role==='admin') return true;
  var divs=(SESSION.u&&SESSION.u.divisiones)||[];
  if(!divs.length) return true;
  return divs.indexOf(it.div)>-1;
}
function buildNav(){
  var items=(NAV[SESSION.role]||NAV.admin).filter(navVisible);
  if(DEMO_PUBLIC){ var hide={propiedades:1,rentagarantizada:1,usuarios:1,solicitudes_re:1,mensajes:1,contactos_re:1,contactos_gar:1,rgcartera:1,re_resumen:1}; items=items.filter(function(it){ return it.sec||!hide[it.id]; }); }
  /* quitar cabeceras de sección que se hayan quedado sin elementos */
  items=items.filter(function(it,i,arr){ if(!it.sec)return true; return (i+1<arr.length)&&!arr[i+1].sec; });
  var m=metrics();
  $('#nav').innerHTML=items.map(function(it){
    if(it.sec){ var slg=SEC_LOGO[it.sec]; return '<div class="nav-label'+(slg?' has-logo':'')+'">'+(slg?'<img src="'+slg+'" alt="'+it.sec+'">':it.sec)+'</div>'; }
    var bcount=it.badge==='tareas'?m.tareasPendientes:(it.badge==='mensajes'?MSG_UNREAD:(it.badge?m.leadsNuevos:0));
    var badge=bcount?'<span class="badge">'+bcount+'</span>':'';
    var lg=NAV_LOGO[it.id];
    var iconHtml=lg?('<img class="navlogo" src="'+lg.logo+'" alt="">'):('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">'+(ICONS[it.ic]||'')+'</svg>');
    return '<a data-view="'+it.id+'">'+iconHtml+(lg?lg.t:it.t)+badge+'</a>';
  }).join('');
  $$('#nav a').forEach(function(a){ a.onclick=function(){ go(a.getAttribute('data-view')); }; });
}

/* probar si hay servidor: usamos el endpoint público /health (responde 200,
   así no genera un 401 en el contador de errores de Netlify en cada carga). */
(function probeBackend(){
  if(DEMO_PUBLIC)return;
  /* Reintenta antes de asumir modo demo: cubre arranques en frío del servidor,
     donde el primer /ping puede tardar o fallar sin que el backend esté caído. */
  var tries=0, max=4, waits=[600,1500,3000];
  function probe(){
    fetch(API_BASE+'/ping',{method:'GET',cache:'no-store'}).then(function(r){
      var ct=(r.headers.get('content-type')||'');
      if(r.status===200&&ct.indexOf('json')>-1){ /* hay servidor real */ return; }
      retry();
    }).catch(retry);
  }
  function retry(){ tries++; if(tries>=max){ showDemoHint(); return; } setTimeout(probe, waits[Math.min(tries-1,waits.length-1)]); }
  probe();
})();
function showDemoHint(){ DEMO_ON=true; var h=$('#loginHint'); if(h)h.innerHTML='Estás en modo demostración: usa los botones de arriba para entrar como cada tipo de usuario.'; renderAccUI(); }

}

function loginFail(){ $('#loginErr').textContent='Credenciales incorrectas. Revisa usuario y contraseña.'; $('#loginErr').classList.add('show'); }

function doLogin(){
  var user=$('#luser').value.trim(), pass=$('#lpass').value;
  if(!user||!pass){ $('#loginErr').textContent='Introduce usuario y contraseña.'; $('#loginErr').classList.add('show'); return; }
  $('#loginErr').classList.remove('show');
  var btn=$('#loginBtn'); btn.disabled=true; btn.textContent='Entrando…';
  apiLogin(user,pass).then(function(res){
    btn.disabled=false; btn.textContent='Entrar';
    if(res.ok && res.data && res.data.token){
      TOKEN=res.data.token; BACKEND=true;
      try{ sessionStorage.setItem('brava_crm_token',TOKEN); }catch(e){}
      enterWithUser(res.data.user);
    } else if(!tryDemo(user,pass)){ loginFail(); }
  }).catch(function(){
    btn.disabled=false; btn.textContent='Entrar';
    if(!tryDemo(user,pass)) loginFail();
  });
}
$('#loginBtn').onclick=doLogin;
$('#lpass').onkeydown=function(e){ if(e.key==='Enter')doLogin(); };
(function(){ var t=$('#lpassToggle'); if(t)t.onclick=function(){ var i=$('#lpass'); var show=i.type==='password'; i.type=show?'text':'password'; t.classList.toggle('on',show); t.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña'); i.focus(); }; })();

function enterWithUser(u){
  var role=u.role;
  SESSION={role:role,u:{username:u.username,name:u.name,av:u.avatar||(u.name||'?').slice(0,2).toUpperCase(),roleLabel:roleLabelFor(role),divisiones:u.divisiones||[]}};

    $('#login').classList.add('hide');
    $('#app').classList.add('show');
    var su=SESSION.u;
    $('#uname').textContent=su.name; $('#uav').textContent=su.av; $('#urole').textContent=su.roleLabel;

    var nav=NAV[role]||NAV.admin;
    var first=nav.find(function(x){return x.id;}).id;
    go(first);
  }
  if(BACKEND){
    apiBootstrap().then(function(data){ DB=data; buildSnapshot(); proceed(); }).catch(function(){ toast('Error cargando datos del servidor'); var btn=$('#loginBtn'); if(btn){btn.disabled=false;btn.textContent='Entrar';} });
  } else { proceed(); }
}

}
